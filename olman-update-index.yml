resource_types:
  - name: rclone
    type: docker-image
    source:
      repository: sothr/concourse-rclone-resource
      tag: latest
  - name: irc-notification
    type: docker-image
    source:
      repository: flavorjones/irc-notification-resource

resources:
  - name: olman.git
    type: git
    icon: github
    source:
      uri: https://github.com/openscad/openscad-library-manager.git
  - name: rclone
    type: rclone
    source:
      config: |
        [sftp]
        type = sftp
        host = ((rclone-host))
        user = ((rclone-username))
        pass = ((rclone-password))
        shell_type = unix
  - name: libera-openscad-ci
    type: irc-notification
    source:
      server: irc.libera.chat
      port: 6697
      join: true
      channel: ((openscad-ci-bot-channel))
      user: ((openscad-ci-bot-username))
      password: ((openscad-ci-bot-password))

jobs:
  - name: build
    public: true
    plan:
      - put: libera-openscad-ci
        params:
          message: >
            Starting ${BUILD_TEAM_NAME}/${BUILD_PIPELINE_NAME}: build ${BUILD_ID} ${BUILD_URL}
      - get: olman.git
      - task: update-index
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: openscad/olman-base
          inputs:
            - name: olman.git
          outputs:
            - name: out
          run:
            path: /bin/bash
            args:
              - -exc
              - |
                set -euo pipefail
                cat /etc/os-release
                . /olman/.venv/bin/activate
                python3 -u ./olman.git/olman-remote/index_generator.py --accepted-repositories ./olman.git/output_files/accepted_repositories.txt --output out/remote_index.json -v
      - put: rclone
        params:
          source: out
          destination:
            - dir: "sftp:share/olman/"
    on_success:
      put: libera-openscad-ci
      params:
        message: >
          Build successful ${BUILD_TEAM_NAME}/${BUILD_PIPELINE_NAME}: build ${BUILD_ID} ${BUILD_URL}
    on_failure:
      put: libera-openscad-ci
      params:
        message: >
          Build failed ${BUILD_TEAM_NAME}/${BUILD_PIPELINE_NAME}: build ${BUILD_ID} ${BUILD_URL}
